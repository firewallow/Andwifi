name: build-apk
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - name: Android iskeletini olustur
        run: |
          cp -r lib /tmp/lib && cp pubspec.yaml /tmp/pubspec.yaml
          flutter create . --platforms=android --org com.turquan --project-name turquan_survey
          cp -r /tmp/lib/. lib/ && cp /tmp/pubspec.yaml pubspec.yaml
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Uygulama adini ayarla
        run: sed -i 's#android:label="turquan_survey"#android:label="Turquan Site Survey"#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Ikonu olustur
        run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: {name: turquan-survey-apk, path: build/app/outputs/flutter-apk/app-release.apk}
