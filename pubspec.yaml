name: turquan_survey
description: Turquan Site Survey
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  wifi_scan: ^0.4.1
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
dev_dependencies:
  flutter_launcher_icons: ^0.14.1
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon_fg.png
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon.png
